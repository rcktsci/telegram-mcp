services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegram-mcp
      POSTGRES_USER: telegram-mcp
      POSTGRES_PASSWORD: telegram-mcp
    ports:
      - "5432:5432/tcp"
    volumes:
      - ./postgresql-data:/var/lib/postgresql
    restart: unless-stopped

  telegram-mcp:
    image: ghcr.io/rcktsci/telegram-mcp:2026-10-23
    pull_policy: always
    build: .
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: telegram-mcp
      DB_USER: telegram-mcp
      DB_PASSWORD: telegram-mcp
      # Change it, please. If empty — every /api/* request is rejected (fail closed).
      UI_MASTER_TOKEN: ""
    ports:
      - "8001:8000/tcp"   # MCP: Streamable HTTP (Bearer = agent token, mint in UI)
      - "8080:8080/tcp"   # UI:  management (login = master token)
    volumes:
      - ./files:/app/files
      - ./config.yml:/app/config.yml:ro   # cp config.yml.example config.yml, then fill in
    restart: unless-stopped
